<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Infinit Respawn — provably fair games on Solana Devnet." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Infinit Respawn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Baloo+2:wght@600;700;800&family=Luckiest+Guy&family=Chakra+Petch:wght@500;600;700&family=Archivo+Black&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Paint the stored theme before first paint so the page never flashes the
      // wrong palette. ThemeProvider takes over from here.
      try {
        var t = localStorage.getItem('gambling-hub.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {
        /* private mode — dark is already the default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
